name: Check

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Reference evaluation self-check
        run: npm run eval:smoke -- --out .evals/ci
      - name: Long task reference self-check
        run: npm run eval:long:smoke -- --out .evals/ci-long
      - name: Prompt and harness reference self-check
        run: npm run eval:experiment -- --mode reference --trials 1 --out .evals/ci-experiment
      - name: Real repository reference self-check
        run: npm run eval:repository:smoke -- --out .evals/ci-repository
      - name: Reject incomplete repository solutions
        run: node --import tsx eval/repository/calibrate.ts .evals/ci-repository-calibration
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: reference-evals-${{ matrix.os }}-node${{ matrix.node }}
          path: |
            .evals/ci/
            .evals/ci-long/
            .evals/ci-experiment/
            .evals/ci-repository/
            .evals/ci-repository-calibration/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 14
