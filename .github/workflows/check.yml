name: Check

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Reference evaluation self-check
        run: npm run eval:smoke -- --out .evals/ci
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: reference-evals-${{ matrix.os }}-node${{ matrix.node }}
          path: .evals/ci/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 14
